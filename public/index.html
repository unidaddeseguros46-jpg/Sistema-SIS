<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital San José</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/calendario-popover.css">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            width: 100%;
            z-index: 2;
        }

        .main-login-card {
            width: 100%;
            max-width: 420px;
            flex-shrink: 0;
        }

        #error-msg {
            color: #ef4444;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0;
            margin-top: 0;
            transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.4s ease,
                        padding 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        margin-top 0.4s ease;
        }

        #error-msg.visible {
            max-height: 200px;
            opacity: 1;
            padding: 0;
            margin-top: 15px;
        }

        #error-msg:empty {
            display: block;
        }

        .consulta-link-wrap {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .consulta-link {
            display: inline;
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.25s ease;
            cursor: pointer;
        }
        .consulta-link:hover {
            color: #2563eb;
            text-shadow: 0 0 4px rgba(37, 99, 235, 0.3), 0 0 8px rgba(37, 99, 235, 0.15);
        }
        .consulta-link i {
            margin-right: 6px;
        }

        .consulta-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .consulta-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .consulta-overlay-content {
            position: fixed;
            top: 1cm;
            left: 1cm;
            right: 1cm;
            bottom: 1cm;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .consulta-overlay-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
        }
        .consulta-volver-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
            transition: all 0.2s ease;
            margin-left: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        .consulta-volver-btn:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .consulta-filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .consulta-filter-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .consulta-filter-btn:hover,
        .consulta-filter-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .consulta-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
            overflow: hidden;
        }
        .consulta-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .consulta-action-btn {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            height: 42px;
            white-space: nowrap;
            border: 1.5px solid #bfdbfe;
        }
        .consulta-action-btn.buscar {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }
        .consulta-action-btn.buscar:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .consulta-action-btn.limpiar {
            background: #ffffff;
            color: #2563eb;
        }
        .consulta-action-btn.limpiar:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .consulta-input-group {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0 15px;
            height: 42px;
            transition: border-color 0.2s ease;
        }
        .consulta-input-group:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .consulta-input-group i {
            color: #64748b;
            font-size: 14px;
        }
        .consulta-input-group input {
            border: none;
            padding: 12px 10px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: transparent;
        }
        .consulta-input-group input::placeholder {
            color: #94a3b8;
        }

        .consulta-date-group {
            position: relative;
        }
        #consulta-date-popover {
            display: none;
        }
        #consulta-date-popover.show {
            display: block;
            position: fixed;
            z-index: 10003;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
            padding: 16px 20px;
            width: 320px;
            animation: popoverIn 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        #consulta-date-popover .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #consulta-date-popover .cal-today-btn {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            border: 1.5px solid #bfdbfe;
            background: #eff6ff;
            color: #3b82f6;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
            height: fit-content;
        }
        #consulta-date-popover .cal-today-btn:hover {
            background: #3b82f6 !important;
            color: #fff;
            border-color: #3b82f6;
        }
        @keyframes popoverIn {
            from { opacity: 0; transform: translateY(-6px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Resultados ── */
        .consulta-results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
        }
        .consulta-results table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #ffffff;
        }
        .consulta-results thead {
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .consulta-results th {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #bfdbfe;
            white-space: nowrap;
        }
        .consulta-results td {
            padding: 9px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            background: #ffffff;
        }
        .consulta-results tbody tr:hover {
            background: #eff6ff;
        }
        .consulta-results tbody tr:last-child td {
            border-bottom: none;
        }
        .consulta-results-loading,
        .consulta-results-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 14px;
        }
        .consulta-results-loading i {
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-wrapper" id="login-wrapper">
            <!-- Tarjeta Central con Glassmorphism -->
            <div class="login-card main-login-card">

            <!-- Círculo del Logo Flotante -->
            <div class="logo-circle">
                <img src="img/logotipo_transparent.png" alt="Logo de la Empresa" class="company-logo">
            </div>

            <form id="login-form" class="login-form">
                <h2>Iniciar Sesión</h2>

                <div class="form-group">
                    <label for="role">Rol</label>
                    <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                        <i class="fa-solid fa-user-tag" style="color:#64748b; margin-right:10px; flex-shrink:0;"></i>
                        <select id="role" name="role" class="global-search-input custom-select-source" style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                            <option value="" disabled selected hidden>Seleccione su rol</option>
                            <option value="Desarrollador">Desarrollador</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Usuario General">Usuario General</option>
                        </select>
                        <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ingrese su Usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Ingrese su Contraseña">
                        <button type="button" id="toggle-password" class="toggle-btn" title="Mostrar/Ocultar">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Recordar datos</label>
                    </div>
                    <a href="recuperar-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="login-btn" class="login-btn">
                    <span class="btn-text">Ingresar</span>
                    <div class="spinner hidden"></div>
                </button>
                <p id="error-msg" class="error-msg"></p>

                <div class="consulta-link-wrap">
                    <a href="consulta-rn.html" class="consulta-link">
                        <i class="fa-solid fa-baby"></i> Consultar estado de Recién Nacido
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="consulta-overlay" id="consulta-overlay">
        <div class="consulta-overlay-content">
            <h2 class="consulta-overlay-title">
                Recién Nacidos <span style="color:#3b82f6;">Temporales</span>
                <button class="consulta-volver-btn" id="consulta-volver-btn">
                    <i class="fa-solid fa-arrow-left"></i> Volver a Login
                </button>
            </h2>

            <div class="consulta-filter-row">
                <button class="consulta-filter-btn active" data-filter="bebe">Bebé</button>
                <button class="consulta-filter-btn" data-filter="mama">Mamá</button>
                <button class="consulta-filter-btn" data-filter="fecha">Fecha de Nacimiento</button>
            </div>

            <div class="consulta-input-row">
                <div class="consulta-input-group" data-filter="bebe">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Apellidos del bebé..." size="28">
                </div>
                <div class="consulta-input-group" data-filter="mama" style="display:none;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Apellidos de la mamá..." size="28">
                </div>
                <div class="consulta-input-group consulta-date-group" data-filter="fecha" style="display:none;">
                    <i class="fa-regular fa-calendar consulta-date-icon" id="consulta-date-icon"></i>
                    <input type="text" id="consulta-fecha-input" placeholder="dd/mm/aaaa" size="22" autocomplete="off">
                </div>
                <div class="cr-date-popover" id="consulta-date-popover">
                    <div class="cal-filters">
                        <div class="filter-group">
                            <label>Mes</label>
                            <select class="filter-select" id="consulta-cal-month"></select>
                        </div>
                        <div class="filter-group">
                            <label>Año</label>
                            <select class="filter-select" id="consulta-cal-year"></select>
                        </div>
                        <button class="cal-today-btn" id="consulta-cal-month-search">Buscar este mes</button>
                    </div>
                    <div class="cal-header">
                        <button class="cal-nav-btn" id="consulta-cal-prev"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="cal-title" id="consulta-cal-title">Mes Año</span>
                        <button class="cal-nav-btn" id="consulta-cal-next"><i class="fa-solid fa-chevron-right"></i></button>
                        <button class="cal-today-btn" id="consulta-cal-today">Hoy</button>
                    </div>
                    <div class="cal-weekdays">
                        <span>D</span><span>L</span><span>M</span><span>MI</span><span>J</span><span>V</span><span>S</span>
                    </div>
                    <div class="cal-days-grid" id="consulta-cal-grid"></div>
                </div>
                <div class="consulta-actions">
                    <button class="consulta-action-btn buscar">Buscar</button>
                    <button class="consulta-action-btn limpiar">Limpiar</button>
                </div>
            </div>

            <div class="consulta-results" id="consulta-results">
                <div class="consulta-results-empty" id="consulta-results-placeholder">
                    Ingresa apellidos del bebé o de la mamá
                </div>
                <table id="consulta-results-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Bebé</th>
                            <th>Mamá</th>
                            <th>Fecha Nac.</th>
                            <th>Estado</th>
                            <th>Establecimiento</th>
                        </tr>
                    </thead>
                    <tbody id="consulta-results-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Scripts locales -->
    <script src="js/supabase-config.js"></script>
    <script src="js/custom-select.js"></script>
    <script src="js/calendario-popover.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
