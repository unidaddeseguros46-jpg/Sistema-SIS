<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión Hospitalaria - Hospital San José. Acceso al sistema de registro, seguimiento y consulta de pacientes.">
    <title>Login - Hospital San José</title>

    <style>*{box-sizing:border-box;margin:0;padding:0}img{max-width:100%;height:auto}body,html{width:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;height:auto;background-color:#f8fafc}:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}:focus:not(:focus-visible){outline:none}.login-page{min-height:100vh;width:100%;background:url('img/fondo.webp') center/cover no-repeat scroll;display:flex;justify-content:center;align-items:center;position:relative;padding:20px}.login-page::before{content:"";position:absolute;inset:0;background:rgba(15,23,42,.7);z-index:1}.login-card{position:relative;z-index:2;background:#fff;border-radius:12px;padding:70px 40px 40px;width:100%;max-width:420px;box-shadow:0 10px 25px rgba(0,0,0,.1);margin-top:65px}.logo-circle{position:absolute;top:-65px;left:50%;transform:translateX(-50%);width:130px;height:130px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 5px 15px rgba(0,0,0,.1);overflow:hidden;padding:10px}.company-logo{width:100%;height:100%;object-fit:contain}.login-form h1,.login-form h2{margin-bottom:25px;color:#333;font-size:26px;text-align:center;font-weight:600}.form-group{margin-bottom:18px}.form-group label{font-size:14px;color:#555;margin-bottom:8px;display:block;font-weight:500}.form-group input{width:100%;padding:12px 14px;font-size:15px;background:#fff;border:1px solid #cbd5e1;border-radius:4px;outline:0;transition:all .3s;box-sizing:border-box;color:#1e293b}.form-group input:focus{background:#fff;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.3)}.password-wrapper{position:relative;display:flex}.toggle-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:none;background:0 0;cursor:pointer;color:#64748b;font-size:17px;padding:0}.remember-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:#555}.forgot-link{font-size:13px;color:#3b82f6;text-decoration:none;font-weight:500;transition:all .2s}.forgot-link:hover{color:#2563eb;text-decoration:underline}.login-btn{width:100%;padding:14px;font-size:16px;background:#3b82f6;color:#fff;border:none;border-radius:4px;cursor:pointer;position:relative;display:flex;justify-content:center;align-items:center;font-weight:600;transition:all .3s ease;box-shadow:0 4px 6px -1px rgba(59,130,246,.4)}.login-btn:hover:not(:disabled){background:#2563eb;transform:translateY(-2px);box-shadow:0 6px 12px -2px rgba(59,130,246,.5)}.login-btn:active:not(:disabled){transform:translateY(0)}.login-btn:disabled{opacity:.7;cursor:not-allowed;background:#94a3b8;box-shadow:none}.error-msg{color:#8b0000;font-size:14px;margin-top:15px;text-align:center;background:0 0;padding:0;border:none}.error-msg:empty{display:none}.spinner{width:18px;height:18px;border:2px solid transparent;border-top:2px solid #fff;border-radius:50%;position:absolute;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none}.fa-icon{width:1em;height:1em;vertical-align:-.125em;fill:currentColor;flex-shrink:0}.fa-icon.chevron-position{position:absolute;right:15px}.login-wrapper{display:flex;justify-content:center;align-items:center;gap:0;width:100%;z-index:2}.main-login-card{width:100%;max-width:420px;flex-shrink:0}#error-msg{color:#ef4444;max-height:0;opacity:0;overflow:hidden;padding:0;margin-top:0;transition:max-height .45s cubic-bezier(.16,1,.3,1),opacity .4s ease,padding .45s cubic-bezier(.16,1,.3,1),margin-top .4s ease}#error-msg.visible{max-height:200px;opacity:1;padding:0;margin-top:15px}#error-msg:empty{display:block}.consulta-overlay{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.6);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease}    </style>

    <link rel="preload" as="style" href="css/login.css">
    <link rel="stylesheet" href="css/login.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="css/login.css"></noscript>
    <link rel="stylesheet" href="css/calendario-popover.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="css/calendario-popover.css"></noscript>
</head>

<body>

    <main class="login-page">
        <div class="login-wrapper" id="login-wrapper">
            <div class="login-card main-login-card">

            <div class="logo-circle">
                <img src="img/logotipo_transparent.png" alt="Logo de la Empresa" class="company-logo" width="110" height="110" fetchpriority="high">
            </div>

            <form id="login-form" class="login-form">
                <h1>Iniciar Sesión</h1>

                <div class="form-group">
                    <label for="role">Rol</label>
                    <div class="custom-select-wrapper filter-dropdown-wrapper" id="custom-filter-role" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                        <div class="custom-select-trigger" style="gap:10px;">
                            <svg class="fa-icon trigger-icon" style="color:#64748b;width:18px"><use href="#fa-user-tag"/></svg>
                            <span class="custom-select-text"></span>
                            <svg class="fa-icon chevron-icon" style="color:#94a3b8;font-size:14px;margin-left:auto;"><use href="#fa-chevron-down"/></svg>
                        </div>
                        <ul class="custom-select-options" role="listbox" id="custom-filter-role-list"></ul>
                    </div>
                    <select id="role" name="role" style="display:none">
                        <option value="">Seleccione su rol</option>
                        <option value="Desarrollador">Desarrollador</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Usuario General">Usuario General</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ingrese su Usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Ingrese su Contraseña">
                        <button type="button" id="toggle-password" class="toggle-btn" title="Mostrar/Ocultar">
                            <svg class="fa-icon toggle-icon" id="toggle-icon" style="font-size:17px;color:#64748b"><use href="#fa-eye"/></svg>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Recordar datos</label>
                    </div>
                    <a href="recuperar-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="login-btn" class="login-btn">
                    <span class="btn-text">Ingresar</span>
                    <div class="spinner hidden"></div>
                </button>
                <p id="error-msg" class="error-msg"></p>

                <div class="consulta-link-wrap">
                    <button type="button" class="consulta-link">
                        <svg class="fa-icon" style="margin-right:6px;width:14px"><use href="#fa-baby"/></svg> Consultar estado de Recién Nacido
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="consulta-overlay" id="consulta-overlay">
        <div class="consulta-overlay-content">
            <h2 class="consulta-overlay-title">
                Recién Nacidos <span style="color:#3b82f6;">Temporales</span>
                <button class="consulta-volver-btn" id="consulta-volver-btn">
                    <svg class="fa-icon" style="margin-right:6px;width:14px"><use href="#fa-arrow-left"/></svg> Volver a Login
                </button>
            </h2>

            <div class="consulta-filter-row">
                <button class="consulta-filter-btn active" data-filter="bebe">Bebé</button>
                <button class="consulta-filter-btn" data-filter="mama">Mamá</button>
                <button class="consulta-filter-btn" data-filter="fecha">Fecha de Nacimiento</button>
            </div>

            <div class="consulta-input-row">
                <div class="consulta-input-group" data-filter="bebe">
                    <svg class="fa-icon" style="margin-right:6px;width:14px"><use href="#fa-magnifying-glass"/></svg>
                    <input type="text" placeholder="Apellidos del bebé..." size="28">
                </div>
                <div class="consulta-input-group" data-filter="mama" style="display:none;">
                    <svg class="fa-icon" style="margin-right:6px;width:14px"><use href="#fa-magnifying-glass"/></svg>
                    <input type="text" placeholder="Apellidos de la mamá..." size="28">
                </div>
                <div class="consulta-input-group consulta-date-group" data-filter="fecha" style="display:none;">
                    <svg class="fa-icon consulta-date-icon" id="consulta-date-icon" style="margin-right:6px;width:14px;color:#64748b"><use href="#fa-calendar"/></svg>
                    <input type="text" id="consulta-fecha-input" placeholder="dd/mm/aaaa" size="22" autocomplete="off">
                </div>
                <div class="cr-date-popover" id="consulta-date-popover">
                    <div class="cal-filters">
                        <div class="filter-group">
                            <label>Mes</label>
                            <select class="filter-select" id="consulta-cal-month"></select>
                        </div>
                        <div class="filter-group">
                            <label>Año</label>
                            <select class="filter-select" id="consulta-cal-year"></select>
                        </div>
                        <button class="cal-today-btn" id="consulta-cal-month-search">Buscar este mes</button>
                    </div>
                    <div class="cal-header">
                        <button class="cal-nav-btn" id="consulta-cal-prev"><svg class="fa-icon" style="width:12px"><use href="#fa-chevron-left"/></svg></button>
                        <span class="cal-title" id="consulta-cal-title">Mes Año</span>
                        <button class="cal-nav-btn" id="consulta-cal-next"><svg class="fa-icon" style="width:12px"><use href="#fa-chevron-right"/></svg></button>
                        <button class="cal-today-btn" id="consulta-cal-today">Hoy</button>
                    </div>
                    <div class="cal-weekdays">
                        <span>D</span><span>L</span><span>M</span><span>MI</span><span>J</span><span>V</span><span>S</span>
                    </div>
                    <div class="cal-days-grid" id="consulta-cal-grid"></div>
                </div>
                <div class="consulta-actions">
                    <button class="consulta-action-btn buscar">Buscar</button>
                    <button class="consulta-action-btn limpiar">Limpiar</button>
                </div>
            </div>

            <div class="consulta-results" id="consulta-results">
                <div class="consulta-results-empty" id="consulta-results-placeholder">
                    Ingresa apellidos del bebé o de la mamá
                </div>
                <table id="consulta-results-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Bebé</th>
                            <th>Mamá</th>
                            <th>Fecha Nac.</th>
                            <th>Estado</th>
                            <th>Establecimiento</th>
                        </tr>
                    </thead>
                    <tbody id="consulta-results-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/filter-dropdown.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-filter-role'),
                listEl: document.getElementById('custom-filter-role-list'),
                hiddenSelectEl: document.getElementById('role'),
                defaultText: 'Seleccione su rol',
                options: ['Desarrollador', 'Administrador', 'Usuario General'],
                fixedWidth: true
            });
        });
    </script>
    <script src="js/calendario-popover.js" defer></script>
    <script src="js/login.js" defer></script>
</body>

</html>
