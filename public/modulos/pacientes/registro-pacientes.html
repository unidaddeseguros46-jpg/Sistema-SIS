                                <input type="text" id="paciente-dni" class="standard-input" required

                            </div>
                        </div>

                        <div class="input-stacked col-span-2" style="position:relative;">
                            <label for="paciente-fecha-nac">Fecha de Nacimiento</label>
                            <div style="position:relative;">
                                <div id="fnac-trigger" style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94a3b8; z-index:1;">
                                    <svg class="fa-icon" aria-hidden="true"><use href="#ir-calendar"/></svg>
                                </div>
                                <svg class="fa-icon chevron-icon" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:10px; pointer-events:none;" aria-hidden="true"><use href="#ir-chevron-down"/></svg>
                                <input type="text" id="paciente-fecha-nac" class="standard-input" placeholder="dd/mm/aaaa"
                                    autocomplete="off" required style="padding-left:40px; padding-right:30px;">
                            </div>
                            <div class="cr-date-popover" id="fnac-popover"></div>
                        </div>

                        <div id="dv-group" class="input-stacked col-span-2">
                            <label for="paciente-codigo-ver">Código de Verificación</label>
                            <input type="text" id="paciente-codigo-ver" class="standard-input">
                        </div>

                        <div class="input-stacked col-span-3">
                            <label for="paciente-apellidos">Apellidos Completos</label>
                            <input type="text" id="paciente-apellidos" class="standard-input" required>
                        </div>

                        <div class="input-stacked col-span-3">
                            <label for="paciente-nombres">Nombres Completos</label>
                            <input type="text" id="paciente-nombres" class="standard-input" required>
                        </div>

                        <div class="input-stacked col-span-2" id="field-hc">
                            <label for="paciente-hc">Nº Historia Clínica</label>
                            <input type="text" id="paciente-hc" class="standard-input hc-input" maxlength="20">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label for="paciente-seguro">Tipo de Seguro</label>
                            <div class="custom-select-wrapper filter-dropdown-wrapper" id="custom-paciente-seguro" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                                <div class="custom-select-trigger">
                                    <svg class="fa-icon trigger-icon" aria-hidden="true"><use href="#ir-shield-halved"/></svg>
                                    <span class="custom-select-text"></span>
                                    <svg class="fa-icon chevron-icon" aria-hidden="true"><use href="#ir-chevron-down"/></svg>
                                </div>
                                <ul class="custom-select-options" role="listbox" id="custom-paciente-seguro-list"></ul>
                            </div>
                            <select id="paciente-seguro" style="display:none" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                                <option value="EsSalud">EsSalud</option>
                                <option value="SIS">SIS</option>
                                <option value="Saludpol">Saludpol</option>
                                <option value="SOAT">SOAT</option>
                                <option value="Privado">Privado</option>
                                <option value="OTROS TIPOS">OTROS TIPOS</option>
                            </select>
                        </div>

                        <div class="input-stacked col-span-2" id="grupo-otros" style="display: none;">
                            <label for="paciente-seguro-otros">Especificar Seguro</label>
                            <input type="text" id="paciente-seguro-otros" class="standard-input">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label for="paciente-servicio">Servicio</label>
                            <div class="custom-select-wrapper filter-dropdown-wrapper" id="custom-paciente-servicio" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                                <div class="custom-select-trigger">
                                    <svg class="fa-icon trigger-icon" aria-hidden="true"><use href="#ir-building"/></svg>
                                    <span class="custom-select-text"></span>
                                    <svg class="fa-icon chevron-icon" aria-hidden="true"><use href="#ir-chevron-down"/></svg>
                                </div>
                                <ul class="custom-select-options" role="listbox" id="custom-paciente-servicio-list"></ul>
                            </div>
                            <select id="paciente-servicio" data-servicio style="display:none" required>
                                <option value="" disabled selected hidden>Seleccione Servicio</option>
                            </select>
                        </div>

                        <div class="input-stacked col-span-2" style="position:relative;">
                            <label for="rp-fi-input">Fecha y Hora de Ingreso <span style="font-weight:400">(Opcional)</span></label>
                            <div id="rp-fi-wrapper">
                                <div class="fi-date-group" style="position:relative;">
                                    <div id="rp-fi-trigger" style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94a3b8; z-index:1;">
                                        <svg class="fa-icon" aria-hidden="true"><use href="#ir-calendar"/></svg>
                                    </div>
                                    <svg class="fa-icon chevron-icon" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:10px; pointer-events:none;" aria-hidden="true"><use href="#ir-chevron-down"/></svg>
                                    <input type="text" id="rp-fi-input" class="standard-input" placeholder="dd/mm/aaaa" autocomplete="off" style="padding-left:40px; padding-right:28px; height:42px;">
                                    <div class="cr-date-popover" id="rp-fi-popover"></div>
                                </div>
                                <div class="fi-time-group" style="position:relative;">
                                    <div style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; color:#94a3b8; pointer-events:none; z-index:1;">
                                        <svg class="fa-icon" aria-hidden="true"><use href="#ir-clock"/></svg>
                                    </div>
                                    <input type="text" id="rp-hora-ingreso" class="standard-input" placeholder="hh:mm" autocomplete="off" style="height:42px; padding-left:40px; padding-right:15px;">
                                </div>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2" id="field-condicion">
                            <label for="paciente-condicion">Condición Actual</label>
                            <div class="custom-select-wrapper filter-dropdown-wrapper" id="custom-paciente-condicion" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                                <div class="custom-select-trigger">
                                    <svg class="fa-icon trigger-icon" aria-hidden="true"><use href="#ir-heart-pulse"/></svg>
                                    <span class="custom-select-text"></span>
                                    <svg class="fa-icon chevron-icon" aria-hidden="true"><use href="#ir-chevron-down"/></svg>
                                </div>
                                <ul class="custom-select-options" role="listbox" id="custom-paciente-condicion-list"></ul>
                            </div>
                            <select id="paciente-condicion" style="display:none" required disabled>
                                <option value="Hospitalizado" selected>Hospitalizado</option>
                                <option value="Alta">Alta</option>
                                <option value="Fallecido">Fallecido</option>
                            </select>
                        </div>

                        <div class="form-actions"
                            style="grid-column: 1 / -1; display: flex; gap: 15px; margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                            <button type="button" class="btn-module" id="btn-cancelar"
                                style="padding: 12px 25px;">Cancelar</button>
                            <button type="submit" class="btn-module primary" id="btn-guardar"
                                style="padding: 12px 25px;">
                                <span id="guardar-text">Guardar</span>
                                <svg id="guardar-spinner" class="fa-icon ic-spin" style="display:none; margin-left:8px;" aria-hidden="true"><use href="#ir-circle-notch"/></svg>
                            </button>
                        </div>
                    </form>

                    <button id="btn-reintentar-hosp" style="display:none; align-items:center; gap:6px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px;">
                        <svg class="fa-icon" aria-hidden="true"><use href="#ir-rotate"/></svg> Reintentar Fecha de Ingreso
                    </button>
                </div>
            </div>

        </main>
    </div>

    <template id="tpl-calendar-popover">
        <div class="cal-filters">
            <div class="filter-group">
                <label for="{prefix}-month" style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Mes</label>
                <select id="{prefix}-month" class="filter-select"></select>
            </div>
            <div class="filter-group">
                <label for="{prefix}-year" style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Año</label>
                <select id="{prefix}-year" class="filter-select"></select>
            </div>
            <button type="button" id="{prefix}-today" class="btn-module btn-clear-hover" style="padding:5px 12px; font-size:11px; white-space:nowrap; height:fit-content;">Hoy</button>
        </div>
        <div class="calendar-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <button type="button" class="cal-nav-btn" id="{prefix}-prev" aria-label="Mes anterior" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                <svg class="fa-icon" aria-hidden="true"><use href="#ir-chevron-left"/></svg>
            </button>
            <div class="cal-title" id="{prefix}-title"></div>
            <button type="button" class="cal-nav-btn" id="{prefix}-next" aria-label="Mes siguiente" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                <svg class="fa-icon" aria-hidden="true"><use href="#ir-chevron-right"/></svg>
            </button>
        </div>
        <div class="cal-weekdays" aria-hidden="true">
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">D</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">L</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">M</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">MI</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">J</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">V</span>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 0;">S</span>
        </div>
        <div class="cal-days-grid" id="{prefix}-days-grid"></div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../../js/modal-prellenado.js" defer></script>
    <script src="../../js/supabase-config.js" defer></script>
    <script src="../../js/calendario-popover.js" defer></script>
    <script src="../../js/servicios.js" defer></script>
    <script src="../../js/servicio-colores.js" defer></script>
    <script src="../../js/filter-dropdown.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var docFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-tipo-documento'),
                listEl: document.getElementById('custom-tipo-documento-list'),
                hiddenSelectEl: document.getElementById('tipo-documento'),
                defaultText: '',
                options: ['DNI', 'DNI_TEMPORAL', 'CARNET_EXT']
            });

            var segFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-paciente-seguro'),
                listEl: document.getElementById('custom-paciente-seguro-list'),
                hiddenSelectEl: document.getElementById('paciente-seguro'),
                defaultText: 'Seleccione',
                options: ['EsSalud', 'SIS', 'Saludpol', 'SOAT', 'Privado', 'OTROS TIPOS']
            });

            var srvFormFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-paciente-servicio'),
                listEl: document.getElementById('custom-paciente-servicio-list'),
                hiddenSelectEl: document.getElementById('paciente-servicio'),
                defaultText: 'SELECCIONE',
                options: typeof SERVICIOS !== 'undefined' ? SERVICIOS : []
            });

            var condFormFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-paciente-condicion'),
                listEl: document.getElementById('custom-paciente-condicion-list'),
                hiddenSelectEl: document.getElementById('paciente-condicion'),
                defaultText: 'SELECCIONE',
                options: ['Hospitalizado', 'Alta', 'Fallecido']
            });

            var srvFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-filter-servicio'),
                listEl: document.getElementById('custom-filter-servicio-list'),
                hiddenSelectEl: document.getElementById('filter-servicio'),
                defaultText: 'TODOS',
                options: typeof SERVICIOS !== 'undefined' ? SERVICIOS : []
            });

            var condFilter = window.createFilterDropdown({
                dropdownEl: document.getElementById('custom-filter-condicion'),
                listEl: document.getElementById('custom-filter-condicion-list'),
                hiddenSelectEl: document.getElementById('filter-condicion'),
                defaultText: 'TODAS',
                options: ['Hospitalizado', 'Alta', 'Fallecido']
            });

            document.getElementById('clear-filter-servicio').addEventListener('click', function () {
                var searchInput = document.getElementById('btn-search-dni');
                var clearBtn = document.getElementById('btn-search-clear');
                if (searchInput) searchInput.value = '';
                if (clearBtn) clearBtn.style.display = 'none';
                setTimeout(function() {
                    srvFilter.syncSelected();
                    condFilter.syncSelected();
                }, 0);
            });
        });
    </script>
    <script src="../../js/layout.js" defer></script>
    <script src="../../js/paginacion-compartida.js" defer></script>
    <script src="../../js/registro-pacientes.js" defer></script>
    <script>
        (function () {
            var input = document.getElementById('btn-search-dni');
            var clearBtn = document.getElementById('btn-search-clear');
            if (!input || !clearBtn) return;

            function update() {
                clearBtn.style.display = input.value.trim() ? '' : 'none';
            }

            input.addEventListener('input', update);

            clearBtn.addEventListener('click', function () {
                var srvSelect = document.getElementById('filter-servicio');
                var condSelect = document.getElementById('filter-condicion');
                var hasFilters = (srvSelect && srvSelect.value !== '') ||
                                 (condSelect && condSelect.value !== '');
                if (hasFilters) {
                    input.value = '';
                    clearBtn.style.display = 'none';
                    input.focus();
                } else {
                    document.getElementById('clear-filter-servicio').click();
                }
            });

            update();
        })();
    </script>
</body>
</html>
