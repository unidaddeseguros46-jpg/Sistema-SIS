<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - Hospital San José</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/registro-pacientes.css">
    <link rel="stylesheet" href="../../css/calendario-popover.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos para cuando se abre como modal */
        body.is-modal .sidebar, 
        body.is-modal header, 
        body.is-modal .module-commands,
        body.is-modal #view-lista,
        body.is-modal .top-header {
            display: none !important;
        }
        body.is-modal .page-content {
            margin-left: 0 !important;
            padding: 15px !important;
            max-width: 100% !important;
        }
        body.is-modal .main-wrapper {
            background: white !important;
            min-height: auto !important;
            padding-left: 0 !important;
        }
        /* Un solo scrollbar: html fijo al tamaño del iframe, body scrollea */
        html.is-modal {
            height: 100% !important;
            overflow: hidden !important;
        }
        body.is-modal {
            height: 100% !important;
            min-height: 0 !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ── Calendar trigger hover/open ── */
        .cr-date-trigger:hover { border-color: #e2e8f0 !important; }
        .cr-date-trigger.is-open { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    </style>
    <script src="../../js/modal-inline-head.js"></script>
</head>

<body>
    <div class="main-wrapper">
        <main class="page-content" id="page-content">

            <!-- BARRA DE OPERACIONES ESPECÍFICA DEL MÓDULO -->
            <div class="module-commands">
                <div class="commands-left">
                    <div class="filter-group">
                        <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Buscador</label>
                        <div class="global-search-box search-box-dni"
                            style="display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; height: 42px;">
                            <i class="fa-solid fa-magnifying-glass" style="color: #64748b;"></i>
                            <input type="text" id="btn-search-dni" placeholder="Buscar registros por DNI..."
                                class="global-search-input"
                                style="border: none; padding: 12px 10px; outline: none; flex: 1; min-width: 0;">
                            <button id="execute-search" style="display: none;"></button>
                        </div>
                    </div>
 
                     <!-- FILTRO POR SERVICIO -->
                     <div class="filter-group">
                         <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Servicio</label>
                         <div class="global-search-box search-box-servicio"
                             style="display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px;">
                             <i class="fa-solid fa-filter" style="color: #64748b; margin-right: 10px;"></i>
                               <select id="filter-servicio" class="global-search-input custom-select-source" data-servicio
                                   style="border: none; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #94a3b8; background: transparent;">
                                   <option value="" style="color: #94a3b8;">TODOS</option>
                              </select>
                              <i class="fa-solid fa-chevron-down"
                                    style="margin-left: 4px; color: #64748b; font-size: 12px;"></i>
                         </div>
                     </div>
                     <button class="btn-module btn-clear-hover" id="clear-filter-servicio"
                         style="background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 0 15px; font-weight: 500; height: 42px; display: flex; align-items: center; border-radius: 8px; gap: 6px;">
                         <i class="fa-solid fa-broom" style="font-size: 14px; flex-shrink: 0;"></i>
                         <span class="clear-filter-text">Limpiar Filtro</span>
                         <span class="clear-filter-short">Limpiar</span>
                     </button>
                     <button class="btn-module primary action-btn" id="local-new-patient-btn" style="padding: 12px 20px;"><i
                             class="fa-solid fa-plus"></i><span>Nuevo<span class="btn-patient-full"> Paciente</span></span></button>
                </div>
            </div>

            <!-- LISTA DE PACIENTES -->
            <div id="view-lista" style="margin-top: 20px;">
                <div id="pagination-container" class="pagination-controls"></div>
                <div class="data-table-container">
                    <!-- LOADING SPINNER -->
                    <div id="loading-indicator"
                        style="display: none; text-align: center; padding: 40px; color: #3b82f6;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
                        <p style="margin-top: 10px; font-weight: 500;">Cargando pacientes...</p>
                    </div>

                    <table class="data-table" id="table-element">
                        <thead>
                            <tr>
                                <th>DNI</th>
                                <th>Paciente</th>
                                <th>H.C.</th>
                                <th>Tipo de Seguro</th>
                                <th>Servicio</th>
                                <th>Condición</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pacientes">
                            <!-- Los registros se generan en JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- FORMULARIO -->
            <div id="view-form" style="display: none; margin-top: 5px;">
                <div class="standard-form-container blue-toptag-form" style="padding: 20px;">
                    <div id="form-welcome-title" class="welcome-text" style="display:none; font-family:'Futura','Montserrat','Inter',sans-serif !important; font-size:17px !important; font-weight:800 !important; color:#0f172a !important; margin:0 0 15px 0 !important; padding-bottom:10px; border-bottom:2px solid #e2e8f0; text-transform:uppercase; letter-spacing:normal; white-space:normal !important; word-wrap:break-word; line-height:1.3;">
                        <span class="welcome-dark">REGISTRO DE </span><span class="welcome-celeste">NUEVOS PACIENTES</span>
                    </div>
                    <div class="form-header-row"
                        style="margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div class="tipo-doc-group" style="flex:1; max-width:280px;">
                            <label style="font-size:13px; font-weight:600; color:#475569; margin-bottom:5px; display:block;">Elegir Tipo de Documento</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-id-card" style="color:#64748b; margin-right:10px;"></i>
                                <select id="tipo-documento" class="global-search-input custom-select-source" style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="DNI">DNI</option>
                                    <option value="DNI_TEMPORAL">DNI Temporal</option>
                                    <option value="CARNET_EXT">Carnet de Extranjería</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>
                        <button type="button" id="btn-obtener-fnac"
                            style="display: flex; align-items: center; gap: 8px; background: #eff6ff; color: #2563eb; border: 1.5px solid #bfdbfe; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;"
                            onmouseover="this.style.background='#dbeafe'; this.style.boxShadow='0 4px 12px rgba(59,130,246,0.15)'; this.style.transform='translateY(-1px)'"
                            onmouseout="this.style.background='#eff6ff'; this.style.boxShadow='none'; this.style.transform='none'">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span id="btn-fnac-text">Obtener Fecha de Nacimiento</span>
                            <i id="fnac-spinner" class="fa-solid fa-circle-notch fa-spin" style="display:none;"></i>
                        </button>
                    </div>

                    <form id="registro-form" novalidate>
                        <input type="hidden" id="paciente-id">
                        <input type="hidden" id="fecha-ingreso-data" value="">
                        <input type="hidden" id="hora-ingreso-data" value="">

                        <!-- FILA 1: DNI | FECHA NAC | CÓDIGO VER. -->
                        <div class="input-stacked col-span-2">
                            <label>DNI del Paciente</label>
                            <div style="display:flex; align-items:stretch;">
                                <span id="dni-prefix" style="display:none; font-weight:700; color:#475569; background:#f1f5f9; padding:10px 10px; border:1px solid #e2e8f0; border-right:none; border-radius:8px 0 0 8px; font-size:14px; white-space:nowrap; line-height:1;"></span>
                                <input type="text" id="paciente-dni" class="standard-input" required
                                    style="border-radius:8px; flex:1; min-width:0;">
                            </div>
                        </div>

                        <!-- FECHA NACIMIENTO -->
                        <div class="input-stacked col-span-2" style="position:relative;">
                            <label>Fecha de Nacimiento</label>
                            <div style="position:relative;">
                                <div id="fnac-trigger" style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94a3b8; z-index:1;">
                                    <i class="fa-regular fa-calendar"></i>
                                </div>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:10px; pointer-events:none;"></i>
                                <input type="text" id="paciente-fecha-nac" class="standard-input" placeholder="dd/mm/aaaa"
                                    autocomplete="off" required style="padding-left:40px; padding-right:30px;">
                            </div>
                            <div class="cr-date-popover" id="fnac-popover" style="display:none; position:fixed; z-index:10003; background:#ffffff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06); padding:16px 20px; width:320px; animation:popoverIn 0.2s cubic-bezier(0.16,1,0.3,1) forwards;">
                                <div class="cal-filters" style="display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f1f5f9;">
                                    <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                        <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Mes</label>
                                        <select id="fnac-month" class="filter-select"></select>
                                    </div>
                                    <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                        <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Año</label>
                                        <select id="fnac-year" class="filter-select"></select>
                                    </div>
                                    <button type="button" id="fnac-today" class="btn-module btn-clear-hover" style="padding:5px 12px; font-size:11px; white-space:nowrap; height:fit-content;">Hoy</button>
                                </div>
                                <div class="calendar-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                                    <button type="button" class="cal-nav-btn" id="fnac-prev" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </button>
                                    <div class="cal-title" id="fnac-title" style="font-size:14px; font-weight:700; color:#0f172a;"></div>
                                    <button type="button" class="cal-nav-btn" id="fnac-next" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                </div>
                                <div class="cal-weekdays" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px;">
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">D</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">L</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">M</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">MI</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">J</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">V</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">S</span>
                                </div>
                                <div class="cal-days-grid" id="fnac-days-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;"></div>
                            </div>
                        </div>

                        <div id="dv-group" class="input-stacked col-span-2">
                            <label>Código de Verificación</label>
                            <input type="text" id="paciente-codigo-ver" class="standard-input"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <!-- FILA 2: APELLIDOS | NOMBRES (3+3) -->
                        <div class="input-stacked col-span-3">
                            <label>Apellidos Completos</label>
                            <input type="text" id="paciente-apellidos" class="standard-input"
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')" required>
                        </div>

                        <div class="input-stacked col-span-3">
                            <label>Nombres Completos</label>
                            <input type="text" id="paciente-nombres" class="standard-input"
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')" required>
                        </div>

                        <!-- FILA 3: HC | TIPO SEGURO (2+2) + GRUPO OTROS (2) -->
                        <div class="input-stacked col-span-2" id="field-hc">
                            <label>Nº Historia Clínica</label>
    <input type="text" id="paciente-hc" class="standard-input hc-input"
        maxlength="20"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Tipo de Seguro</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-shield-halved" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-seguro" class="global-search-input custom-select-source" required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="" disabled selected hidden>Seleccione</option>
                                    <option value="EsSalud">EsSalud</option>
                                    <option value="SIS">SIS</option>
                                    <option value="Saludpol">Saludpol</option>
                                    <option value="SOAT">SOAT</option>
                                    <option value="Privado">Privado</option>
                                    <option value="Otros">Otros tipos</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2" id="grupo-otros" style="display: none;">
                            <label>Especificar Seguro</label>
                            <input type="text" id="paciente-seguro-otros" class="standard-input">
                        </div>

                        <!-- FILA 4: SERVICIO | FECHA INGRESO | CONDICIÓN (2+2+2) -->
                        <!-- SERVICIO -->
                        <div class="input-stacked col-span-2">
                            <label>Servicio</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-building" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-servicio" class="global-search-input custom-select-source" data-servicio required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="" disabled selected hidden>Seleccione Servicio</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <!-- FECHA + HORA DE INGRESO -->
                        <div class="input-stacked col-span-2" style="position:relative;">
                            <label>Fecha y Hora de Ingreso</label>
                            <div id="rp-fi-wrapper">
                                <div class="fi-date-group" style="position:relative;">
                                    <div id="rp-fi-trigger" style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94a3b8; z-index:1;">
                                        <i class="fa-regular fa-calendar"></i>
                                    </div>
                                    <i class="fa-solid fa-chevron-down" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:10px; pointer-events:none;"></i>
                                    <input type="text" id="rp-fi-input" class="standard-input" placeholder="dd/mm/aaaa" autocomplete="off" style="padding-left:40px; padding-right:28px; height:42px;">
                                    <div class="cr-date-popover" id="rp-fi-popover" style="display:none; position:fixed; z-index:10003; background:#ffffff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06); padding:16px 20px; width:320px; animation:popoverIn 0.2s cubic-bezier(0.16,1,0.3,1) forwards;">
                                        <div class="cal-filters" style="display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f1f5f9;">
                                            <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                                <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Mes</label>
                                                <select id="rp-fi-month" class="filter-select"></select>
                                            </div>
                                            <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                                <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Año</label>
                                                <select id="rp-fi-year" class="filter-select"></select>
                                            </div>
                                            <button type="button" id="rp-fi-today" class="btn-module btn-clear-hover" style="padding:5px 12px; font-size:11px; white-space:nowrap; height:fit-content;">Hoy</button>
                                        </div>
                                        <div class="calendar-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                                            <button type="button" class="cal-nav-btn" id="rp-fi-prev" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                                <i class="fa-solid fa-chevron-left"></i>
                                            </button>
                                            <div class="cal-title" id="rp-fi-title" style="font-size:14px; font-weight:700; color:#0f172a;"></div>
                                            <button type="button" class="cal-nav-btn" id="rp-fi-next" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                                <i class="fa-solid fa-chevron-right"></i>
                                            </button>
                                        </div>
                                        <div class="cal-weekdays" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px;">
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">D</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">L</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">M</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">MI</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">J</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">V</span>
                                            <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">S</span>
                                        </div>
                                        <div class="cal-days-grid" id="rp-fi-days-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;"></div>
                                    </div>
                                </div>
                                <div class="fi-time-group" style="position:relative;">
                                    <div style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; color:#94a3b8; pointer-events:none; z-index:1;">
                                        <i class="fa-regular fa-clock"></i>
                                    </div>
                                    <input type="text" id="rp-hora-ingreso" class="standard-input" placeholder="hh:mm" autocomplete="off" style="height:42px; padding-left:40px; padding-right:15px;">
                                </div>
                            </div>
                        </div>

                        <!-- CONDICION ACTUAL -->
                        <div class="input-stacked col-span-2" id="field-condicion">
                            <label>Condición Actual</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-heart-pulse" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-condicion" class="global-search-input custom-select-source" required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="Hospitalizado" selected>Hospitalizado</option>
                                    <option value="Salió de Alta">Alta</option>
                                    <option value="Fallecido">Fallecido</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="form-actions"
                            style="grid-column: 1 / -1; display: flex; gap: 15px; margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                            <button type="button" class="btn-module" id="btn-cancelar"
                                style="padding: 12px 25px;">Cancelar</button>
                            <button type="submit" class="btn-module primary" id="btn-guardar"
                                style="padding: 12px 25px;">
                                <span id="guardar-text">Guardar</span>
                                <i id="guardar-spinner" class="fa-solid fa-circle-notch fa-spin"
                                    style="display:none; margin-left:8px;"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Botón de reintento (oculto, se muestra solo si falla la hospitalización) -->
                    <button id="btn-reintentar-hosp" style="display:none; align-items:center; gap:6px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px;"
                        onmouseover="this.style.background='#fee2e2'"
                        onmouseout="this.style.background='#fef2f2'">
                        <i class="fa-solid fa-rotate"></i> Reintentar Fecha de Ingreso
                    </button>
                </div>
            </div>



        </main>
    </div>
