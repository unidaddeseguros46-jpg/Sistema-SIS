<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - Hospital San José</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/registro-pacientes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos para cuando se abre como modal */
        body.is-modal .sidebar, 
        body.is-modal header, 
        body.is-modal .module-commands,
        body.is-modal #view-lista {
            display: none !important;
        }
        body.is-modal .page-content {
            margin-left: 0 !important;
            padding: 10px !important;
        }
        body.is-modal .main-wrapper {
            background: white !important;
        }
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('view') === 'modal') {
            document.documentElement.classList.add('is-modal');
            // Ocultar body inmediatamente para evitar parpadeo
            document.write('<style id="temp-modal-hide">body { display: none !important; }</style>');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('is-modal'));
        }
    </script>
</head>

<body>
    <div class="main-wrapper">
        <main class="page-content" id="page-content">

            <!-- BARRA DE OPERACIONES ESPECÍFICA DEL MÓDULO -->
            <div class="module-commands">
                <div style="display: flex; gap: 15px; align-items: flex-end;">
                    <div class="filter-group">
                        <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Buscador</label>
                        <div class="global-search-box"
                            style="width: 320px; display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; height: 42px;">
                            <i class="fa-solid fa-magnifying-glass" style="color: #64748b;"></i>
                            <input type="text" id="btn-search-dni" placeholder="Buscar registros por DNI..."
                                class="global-search-input"
                                style="border: none; padding: 12px 10px; outline: none; flex: 1; min-width: 0;">
                            <button id="execute-search" style="display: none;"></button>
                        </div>
                    </div>
 
                     <!-- FILTRO POR SERVICIO -->
                     <div class="filter-group">
                         <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Servicio</label>
                         <div class="global-search-box"
                             style="width: 250px; display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px;">
                             <i class="fa-solid fa-filter" style="color: #64748b; margin-right: 10px;"></i>
                             <select id="filter-servicio" class="global-search-input custom-select-source"
                                 style="border: none; padding: 0; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #94a3b8; background: transparent;">
                                 <option value="" style="color: #94a3b8;">TODOS</option>
                                <option value="Shock trauma">Shock trauma</option>
                                <option value="Salud mental">Salud mental</option>
                                <option value="UVI">UVI</option>
                                <option value="Medicina">Medicina</option>
                                <option value="Cirugía">Cirugía</option>
                                <option value="Pediatría">Pediatría</option>
                                <option value="Neonatología">Neonatología</option>
                                <option value="Ginecología">Ginecología</option>
                                <option value="Puerperio">Puerperio</option>
                             </select>
                             <i class="fa-solid fa-chevron-down"
                                 style="position: absolute; right: 15px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
                         </div>
                     </div>
                     <button class="btn-module btn-clear-hover" id="clear-filter-servicio"
                         style="background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 0 15px; font-weight: 500; height: 42px; display: flex; align-items: center; border-radius: 8px;">Limpiar Filtro</button>
                </div>
                <button class="btn-module primary action-btn" id="local-new-patient-btn" style="padding: 12px 20px;"><i
                        class="fa-solid fa-plus"></i> Nuevo Paciente</button>
            </div>

            <!-- LISTA DE PACIENTES -->
            <div id="view-lista" style="margin-top: 20px;">
                <div class="data-table-container">
                    <!-- LOADING SPINNER -->
                    <div id="loading-indicator"
                        style="display: none; text-align: center; padding: 40px; color: #3b82f6;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
                        <p style="margin-top: 10px; font-weight: 500;">Cargando pacientes...</p>
                    </div>

                    <table class="data-table" id="table-element">
                        <thead>
                            <tr>
                                <th>DNI</th>
                                <th>Paciente</th>
                                <th>H.C.</th>
                                <th>Tipo de Seguro</th>
                                <th>Servicio</th>
                                <th>Condición</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pacientes">
                            <!-- Los registros se generan en JS -->
                        </tbody>
                    </table>
                </div>
                <div id="pagination-container" class="pagination-controls"></div>
            </div>

            <!-- FORMULARIO -->
            <div id="view-form" style="display: none; margin-top: 5px;">
                <div class="standard-form-container blue-toptag-form" style="padding: 20px;">
                    <div
                        style="margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div style="flex:1; max-width:280px;">
                            <label style="font-size:13px; font-weight:600; color:#475569; margin-bottom:5px; display:block;">Elegir Tipo de Documento</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-id-card" style="color:#64748b; margin-right:10px;"></i>
                                <select id="tipo-documento" class="global-search-input custom-select-source" style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="DNI">DNI</option>
                                    <option value="DNI_TEMPORAL">DNI Temporal</option>
                                    <option value="CARNET_EXT">Carnet de Extranjería</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>
                        <button type="button" id="btn-obtener-fnac"
                            style="display: flex; align-items: center; gap: 8px; background: #eff6ff; color: #2563eb; border: 1.5px solid #bfdbfe; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;"
                            onmouseover="this.style.background='#dbeafe'; this.style.boxShadow='0 4px 12px rgba(59,130,246,0.15)'; this.style.transform='translateY(-1px)'"
                            onmouseout="this.style.background='#eff6ff'; this.style.boxShadow='none'; this.style.transform='none'">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span id="btn-fnac-text">Obtener Fecha de Nacimiento</span>
                            <i id="fnac-spinner" class="fa-solid fa-circle-notch fa-spin" style="display:none;"></i>
                        </button>
                    </div>

                    <form id="registro-form" novalidate>
                        <input type="hidden" id="paciente-id">

                        <!-- FILA 1: DNI | CÓDIGO VER. | FECHA NAC (3+2+1 -> usamos 2+2+2) -->
                        <div class="input-stacked col-span-2">
                            <label>DNI del Paciente</label>
                            <div style="display:flex; align-items:stretch;">
                                <span id="dni-prefix" style="display:none; font-weight:700; color:#475569; background:#f1f5f9; padding:10px 10px; border:1px solid #e2e8f0; border-right:none; border-radius:8px 0 0 8px; font-size:14px; white-space:nowrap; line-height:1;"></span>
                                <input type="text" id="paciente-dni" class="standard-input" required
                                    style="border-radius:8px; flex:1; min-width:0;">
                            </div>
                        </div>

                        <div id="dv-group" class="input-stacked col-span-2">
                            <label>Código de Verificación</label>
                            <input type="text" id="paciente-codigo-ver" class="standard-input"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <!-- FECHA NACIMIENTO -->
                        <div class="input-stacked col-span-2">
                            <label>Fecha de Nacimiento</label>
                            <input type="text" id="paciente-fecha-nac" class="standard-input" placeholder="dd/mm/aaaa"
                                required>
                        </div>

                        <!-- FILA 2: APELLIDOS | NOMBRES (3+3) -->
                        <div class="input-stacked col-span-3">
                            <label>Apellidos Completos</label>
                            <input type="text" id="paciente-apellidos" class="standard-input"
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')" required>
                        </div>

                        <div class="input-stacked col-span-3">
                            <label>Nombres Completos</label>
                            <input type="text" id="paciente-nombres" class="standard-input"
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')" required>
                        </div>

                        <!-- FILA 3: HC | TIPO SEGURO (2+2) + GRUPO OTROS (2) -->
                        <div class="input-stacked col-span-2" id="field-hc">
                            <label>Nº Historia Clínica</label>
                            <input type="text" id="paciente-hc" class="standard-input hc-input"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Tipo de Seguro</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-shield-halved" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-seguro" class="global-search-input custom-select-source" required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="" disabled selected hidden>Seleccione</option>
                                    <option value="EsSalud">EsSalud</option>
                                    <option value="SIS">SIS</option>
                                    <option value="Saludpol">Saludpol</option>
                                    <option value="SOAT">SOAT</option>
                                    <option value="Privado">Privado</option>
                                    <option value="Otros">Otros tipos</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2" id="grupo-otros" style="display: none;">
                            <label>Especificar Seguro</label>
                            <input type="text" id="paciente-seguro-otros" class="standard-input">
                        </div>

                        <!-- FILA 4: SERVICIO | CONDICIÓN (3+3) -->
                        <!-- SERVICIO -->
                        <div class="input-stacked col-span-3">
                            <label>Servicio</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-building" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-servicio" class="global-search-input custom-select-source" required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="" disabled selected hidden>Seleccione Servicio</option>
                                    <option value="Shock trauma">Shock trauma</option>
                                    <option value="Salud mental">Salud mental</option>
                                    <option value="UVI">UVI</option>
                                    <option value="Medicina">Medicina</option>
                                    <option value="Cirugía">Cirugía</option>
                                    <option value="Pediatría">Pediatría</option>
                                    <option value="Neonatología">Neonatología</option>
                                    <option value="Ginecología">Ginecología</option>
                                    <option value="Puerperio">Puerperio</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <!-- CONDICION ACTUAL -->
                        <div class="input-stacked col-span-3" id="field-condicion">
                            <label>Condición Actual</label>
                            <div class="global-search-box" style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-heart-pulse" style="color:#64748b; margin-right:10px;"></i>
                                <select id="paciente-condicion" class="global-search-input custom-select-source" required style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="Hospitalizado" selected>Hospitalizado</option>
                                    <option value="Salió de Alta">Alta</option>
                                    <option value="Fallecido">Fallecido</option>
                                </select>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="form-actions"
                            style="grid-column: 1 / -1; display: flex; gap: 15px; margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                            <button type="button" class="btn-module" id="btn-cancelar"
                                style="background: #f1f5f9; color: #64748b; padding: 12px 25px;">Cancelar</button>
                            <button type="submit" class="btn-module primary" id="btn-guardar"
                                style="padding: 12px 25px;">
                                <i class="fa-solid fa-save"></i>
                                <span id="guardar-text">Guardar Registro</span>
                                <i id="guardar-spinner" class="fa-solid fa-circle-notch fa-spin"
                                    style="display:none; margin-left:8px;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>



        </main>
    </div>

    <!-- PRE-LLENADO INMEDIATO (antes de que carguen scripts pesados y auth) -->
    <script>
        if (new URLSearchParams(window.location.search).get('view') === 'modal') {
            (function() {
                // Mostrar formulario inmediatamente
                var vl = document.getElementById('view-lista');
                if (vl) vl.style.display = 'none';
                var vf = document.getElementById('view-form');
                if (vf) vf.style.display = 'block';
                var ts = document.getElementById('temp-modal-hide');
                if (ts) ts.remove();
                document.body.style.display = 'block';
                document.body.classList.add('is-modal');

                var data;
                try {
                    var raw = sessionStorage.getItem('cd_auto_fill');
                    if (raw) data = JSON.parse(raw);
                } catch(e) {}
                if (!data) return;
                sessionStorage.removeItem('cd_auto_fill');

                var setVal = function(id, val) {
                    var el = document.getElementById(id);
                    if (el) el.value = val || '';
                };
                setVal('paciente-dni', data.dni);
                setVal('paciente-nombres', data.nombres);
                setVal('paciente-apellidos', data.apellidos);
                setVal('paciente-codigo-ver', data.codigo_verificacion);

                if (data.tipo_documento) {
                    var td = document.getElementById('tipo-documento');
                    if (td) td.value = data.tipo_documento;
                }
                if (data.tipo_seguro) {
                    var seg = document.getElementById('paciente-seguro');
                    if (seg) {
                        for (var i = 0; i < seg.options.length; i++) {
                            if (seg.options[i].value.toUpperCase() === data.tipo_seguro.toUpperCase()) {
                                seg.value = seg.options[i].value;
                                break;
                            }
                        }
                    }
                }
                if (data.fecha_nacimiento) {
                    var parts = data.fecha_nacimiento.split('-');
                    if (parts.length === 3) {
                        setVal('paciente-fecha-nac', parts[2] + '/' + parts[1] + '/' + parts[0]);
                    }
                }
            })();
        }
    </script>
    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/custom-select.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/dynamic-table.js"></script>
    <script src="../../js/registro-pacientes.js"></script>
</body>

</html>
