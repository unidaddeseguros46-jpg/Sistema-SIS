<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Pacientes - Hospital San Jos&#233;</title>
    <link rel="stylesheet" href="../../css/styles.css?v=2">
    <link rel="stylesheet" href="../../css/registro-pacientes.css?v=2">
    <link rel="stylesheet" href="../../css/seguimiento-pacientes.css?v=2">
    <link rel="stylesheet" href="../../css/calendario-popover.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="main-wrapper">
        <main class="page-content" id="page-content">

            <!-- SECCION DE FILTROS -->
            <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px;">
                <div class="filter-group">
                    <label>DNI o Historia Cl&#237;nica</label>
                    <input type="text" id="filter-dni-hc" class="filter-input" placeholder="Buscar DNI o HC..." style="width: 320px;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <div class="filter-group">
                    <label>Apellidos</label>
                    <input type="text" id="filter-apellidos" class="filter-input" placeholder="Buscar por apellidos..." style="width: 320px;">
                </div>
                <div class="filter-group">
                    <label>Tipo de Seguro</label>
                    <div class="global-search-box" style="width: 160px; display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px;">
                        <i class="fa-solid fa-shield-halved" style="color: #64748b; margin-right: 10px;"></i>
                        <select id="filter-seguro" class="global-search-input custom-select-source" style="border: none; padding: 0; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #94a3b8; background: transparent; font-size: 13px;">
                            <option value="">TODOS</option>
                            <option value="EsSalud">ESSALUD</option>
                            <option value="SIS">SIS</option>
                            <option value="Saludpol">SALUDPOL</option>
                            <option value="SOAT">SOAT</option>
                            <option value="Privado">PRIVADO</option>
                            <option value="Otros">OTROS</option>
                        </select>
                        <i class="fa-solid fa-chevron-down" style="position: absolute; right: 15px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
                    </div>
                </div>
                <div class="filter-group">
                    <label>Servicio</label>
                    <div class="global-search-box" style="width: 160px; display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px;">
                        <i class="fa-solid fa-filter" style="color: #64748b; margin-right: 10px;"></i>
                            <select id="filter-servicio" class="global-search-input custom-select-source" data-servicio style="border: none; padding: 0; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #94a3b8; background: transparent; font-size: 13px;">
                            <option value="" style="color: #94a3b8;">TODOS</option>
                        </select>
                        <i class="fa-solid fa-chevron-down" style="position: absolute; right: 15px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: flex-end; padding-bottom: 2px; margin-left: auto;">
                    <button class="btn-module primary" id="btn-search" style="padding: 10px 20px; height: 42px;"><i class="fa-solid fa-magnifying-glass"></i> <span class="btn-text-resp">Buscar</span></button>
                    <button class="btn-module btn-clear-hover" id="btn-clear" style="padding: 8px 15px; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; font-weight: 500; height: 42px;"><i class="fa-solid fa-broom btn-icon-resp" style="display: none;"></i> <span class="btn-text-resp">Limpiar Filtro</span></button>
                </div>
            </div>

            <!-- FILA CONDICIÓN + BOTÓN ALTA + PAGINACIÓN -->
            <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px;">
                <div class="filter-group">
                    <label>Condici&#243;n</label>
                    <div class="global-search-box" style="width: 200px; display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px;">
                        <i class="fa-solid fa-bed" style="color: #64748b; margin-right: 10px;"></i>
                        <select id="filter-condicion" class="global-search-input custom-select-source" style="border: none; padding: 0; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #1e40af; background: transparent; font-size: 13px;">
                            <option value="Hospitalizado" style="color: #1e40af;">HOSPITALIZADO</option>
                            <option value="">TODAS</option>
                            <option value="Alta">ALTA</option>
                            <option value="Fallecido">FALLECIDO</option>
                        </select>
                        <i class="fa-solid fa-chevron-down" style="position: absolute; right: 15px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
                    </div>
                </div>
                <div class="filter-group">
                    <label>&#160;</label>
                    <button class="btn-module btn-disabled" id="btn-batch-alta"
                        style="padding: 10px 20px; height: 42px; cursor: pointer;">
                        Dar de Alta
                    </button>
                </div>
                <span id="alta-count" style="font-size: 14px; color: #94a3b8; font-weight: 500; align-self: flex-end; padding-bottom: 10px;"></span>
                <div id="pagination-container" class="pagination-controls" style="margin-left: auto; align-self: flex-end;"></div>
            </div>

            <!-- LISTA DE RESULTADOS -->
            <div id="view-resultados">
                <div class="data-table-container">
                    <div id="loading-indicator" style="display: none; text-align: center; padding: 40px; color: #3b82f6;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
                        <p style="margin-top: 10px; font-weight: 500;">Cargando pacientes...</p>
                    </div>
                    <table class="data-table" id="table-pacientes" style="display: none;">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;"><input type="checkbox" id="checkbox-select-all" style="cursor: pointer;"></th>
                                <th>DNI</th>
                                <th>Paciente</th>
                                <th>N&#186; Historia</th>
                                <th>Tipo de Seguro</th>
                                <th>Servicio</th>
                                <th>Condici&#243;n</th>
                                <th style="text-align: center;">ACCI&#211;N</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-pacientes"></tbody>
                    </table>
                </div>
            </div>



            <!-- MODAL FECHA INGRESO -->
            <div id="modal-fecha-ingreso" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:20000; align-items:center; justify-content:center;">
                <div class="modal-content" style="background:#fff; border-radius:12px; padding:28px; max-width:420px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
                    <h3 style="font-size:16px; font-weight:700; color:#0f172a; margin:0 0 6px 0; display:flex; align-items:center; gap:8px;">
                        <i class="fa-solid fa-calendar-plus" style="color:#1e40af;"></i> Regularizar ingreso
                    </h3>
                    <p id="modal-ingreso-paciente" style="font-size:13px; color:#475569; margin:0 0 16px 0;"></p>
                    <div class="cal-filters" style="display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f1f5f9;">
                        <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                            <label style="font-size:12px; font-weight:600; color:#475569;">Mes</label>
                            <select id="modal-ingreso-mes" class="filter-select"></select>
                        </div>
                        <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                            <label style="font-size:12px; font-weight:600; color:#475569;">A&#241;o</label>
                            <select id="modal-ingreso-ano" class="filter-select"></select>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                        <button id="modal-ingreso-prev" class="cal-nav-btn" style="background:none; border:none; cursor:pointer; font-size:16px; color:#64748b; padding:4px 8px;">&#8249;</button>
                        <div id="modal-ingreso-titulo-cal" style="flex:1; font-size:14px; font-weight:600; color:#0f172a; text-align:center;"></div>
                        <button id="modal-ingreso-next" class="cal-nav-btn" style="background:none; border:none; cursor:pointer; font-size:16px; color:#64748b; padding:4px 8px;">&#8250;</button>
                    </div>
                    <div class="cal-weekdays"><span>D</span><span>L</span><span>M</span><span>MI</span><span>J</span><span>V</span><span>S</span></div>
                    <div id="modal-ingreso-calendar" class="cal-days-grid"></div>
                    <input type="hidden" id="modal-ingreso-date" value="">
                    <div style="text-align:center; margin-top:6px;">
                        <button id="modal-ingreso-today" style="background:none; border:none; cursor:pointer; font-size:12px; color:#1e40af; font-weight:600; padding:4px 8px;">Hoy</button>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:16px;">
                        <button id="btn-confirm-ingreso" class="btn-module primary" style="padding:10px 20px; height:42px;"><i class="fa-solid fa-check"></i> Confirmar Ingreso</button>
                        <button id="btn-cancel-ingreso" class="btn-module btn-clear-hover" style="padding:10px 20px; height:42px; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0;">Cancelar</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="../../js/supabase-config.js?v=2"></script>
    <script src="../../js/servicios.js?v=2"></script>
    <script src="../../js/custom-select.js?v=2"></script>
    <script src="../../js/calendario-popover.js?v=2"></script>
    <script src="../../js/layout.js?v=2"></script>
    <script src="../../js/dynamic-table.js?v=2"></script>
    <script src="../../js/seguimiento-pacientes.js?v=2"></script>
</body>
</html>
