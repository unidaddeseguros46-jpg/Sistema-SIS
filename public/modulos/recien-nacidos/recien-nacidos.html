<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recién Nacidos Temporales - Hospital San José</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/registro-pacientes.css">
    <link rel="stylesheet" href="../../css/recien-nacidos.css">
    <link rel="stylesheet" href="../../css/calendario-popover.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS para parseo de Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="main-wrapper">
        <main class="page-content" id="page-content">

            <!-- BARRA DE OPERACIONES -->
            <div class="rn-commands">
                <div class="rn-commands-left">
                    <div class="filter-group">
                        <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Buscador</label>
                        <div class="global-search-box rn-search-box"
                            style="display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; height: 42px;">
                            <i class="fa-solid fa-magnifying-glass" style="color: #64748b;"></i>
                            <input type="text" id="rn-search-input" placeholder="Buscar por código, nombre o documento..."
                                class="global-search-input"
                                style="border: none; padding: 12px 10px; outline: none; flex: 1; min-width: 0;">
                        </div>
                    </div>

                    <!-- FILTRO POR ESTADO -->
                    <div class="filter-group">
                        <label style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block;">Estado</label>
                        <div class="global-search-box"
                            style="display: flex; align-items: center; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0 15px; position: relative; height: 42px; width: fit-content;">
                            <i class="fa-solid fa-filter" style="color: #64748b; margin-right: 10px;"></i>
                             <select id="rn-filter-estado" class="global-search-input custom-select-source"
                                style="border: none; outline: none; flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; cursor: pointer; color: #94a3b8; background: transparent;">
                                <option value="" style="color: #94a3b8;">TODOS</option>
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                                <option value="TRANSFERIDO">TRANSFERIDO</option>
                            </select>
                            <i class="fa-solid fa-chevron-down"
                                style="margin-left: 4px; color: #64748b; font-size: 12px;"></i>
                        </div>
                    </div>

                    <!-- IMPORTAR EXCEL -->
                    <button class="btn-module btn-clear-hover" id="rn-import-btn"
                        style="background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 0 15px; font-weight: 600; height: 42px; display: flex; align-items: center; border-radius: 8px; gap: 6px;">
                        <i class="fa-solid fa-file-excel" style="font-size: 15px; flex-shrink: 0;"></i>
                        <span class="rn-btn-full">Importar Excel</span>
                        <span class="rn-btn-short">Importar</span>
                    </button>

                    <!-- NUEVO REGISTRO -->
                    <button class="btn-module primary action-btn" id="rn-new-btn" style="padding: 12px 20px;">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nuevo<span class="rn-btn-full"> Registro</span></span>
                    </button>
                </div>
            </div>

            <!-- LISTA DE REGISTROS -->
            <div id="rn-view-lista" style="margin-top: 20px;">
                <div id="rn-pagination" class="pagination-controls"></div>
                <div class="data-table-container">
                    <!-- LOADING -->
                    <div id="rn-loading"
                        style="display: none; text-align: center; padding: 40px; color: #3b82f6;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
                        <p style="margin-top: 10px; font-weight: 500;">Cargando registros...</p>
                    </div>

                    <table class="data-table rn-data-table" id="rn-table">
                        <thead>
                            <tr>
                                <th>Cód. Temporal</th>
                                <th>Fecha Registro</th>
                                <th>Recién Nacido</th>
                                <th>F. Nacimiento</th>
                                <th>Doc. Mamá</th>
                                <th>Nombre Mamá</th>
                                <th>Establecimiento</th>
                                <th>Estado</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="rn-tbody">
                            <!-- Registros dinámicos -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- FORMULARIO -->
            <div id="rn-view-form" style="display: none; margin-top: 5px;">
                <div class="standard-form-container blue-toptag-form" style="padding: 20px;">
                    <div id="rn-form-welcome-title" class="welcome-text"
                        style="display:none; font-family:'Futura','Montserrat','Inter',sans-serif !important; font-size:17px !important; font-weight:800 !important; color:#0f172a !important; margin:0 0 15px 0 !important; padding-bottom:10px; border-bottom:2px solid #e2e8f0; text-transform:uppercase; letter-spacing:normal; white-space:normal !important; word-wrap:break-word; line-height:1.3;">
                        <span class="welcome-dark">RECIÉN NACIDOS </span><span class="welcome-celeste">TEMPORALES</span>
                    </div>

                    <form id="rn-registro-form" novalidate>
                        <input type="hidden" id="rn-edit-id">

                        <!-- FILA 1: COD TEMPORAL | FECHA REGISTRO -->
                        <div class="input-stacked col-span-3">
                            <label>Código Temporal</label>
                            <div style="display:flex; align-items:stretch;">
                                <span id="rn-cod-temporal-prefix" style="font-weight:700; color:#475569; background:#f1f5f9; padding:10px 10px; border:1px solid #e2e8f0; border-right:none; border-radius:8px 0 0 8px; font-size:14px; white-space:nowrap; line-height:1; display:flex; align-items:center; justify-content:center;">E- </span>
                                <input type="text" id="rn-cod-temporal" class="standard-input" required
                                    placeholder="10733526"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                    style="border-radius:0 8px 8px 0; flex:1; min-width:0;">
                            </div>
                        </div>

                        <div class="input-stacked col-span-3" style="position:relative;">
                            <label>Fecha de Registro</label>
                            <div style="position:relative;">
                                <input type="text" id="rn-fecha-registro" class="standard-input" placeholder="dd/mm/aaaa" autocomplete="off" required disabled style="padding-left:15px; padding-right:15px;">
                            </div>
                        </div>

                        <!-- FILA 2: NOMBRE RN | FECHA NACIMIENTO -->
                        <div class="input-stacked col-span-3">
                            <label>Apellidos y Nombres del Recién Nacido</label>
                            <input type="text" id="rn-nombre-rn" class="standard-input" required
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')">
                        </div>

                        <div class="input-stacked col-span-3" style="position:relative;">
                            <label>Fecha de Nacimiento</label>
                            <div style="position:relative;">
                                <div id="rn-fnac-trigger" style="position:absolute; left:0; top:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94a3b8; z-index:1;">
                                    <i class="fa-regular fa-calendar"></i>
                                </div>
                                <i class="fa-solid fa-chevron-down" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:10px; pointer-events:none;"></i>
                                <input type="text" id="rn-fecha-nacimiento" class="standard-input" placeholder="dd/mm/aaaa" autocomplete="off" required style="padding-left:40px; padding-right:30px;">
                            </div>
                            <div class="cr-date-popover" id="rn-fnac-popover" style="display:none; position:fixed; z-index:10003; background:#ffffff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06); padding:16px 20px; width:320px; animation:popoverIn 0.2s cubic-bezier(0.16,1,0.3,1) forwards;">
                                <div class="cal-filters" style="display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f1f5f9;">
                                    <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                        <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Mes</label>
                                        <select id="rn-fnac-month" class="filter-select"></select>
                                    </div>
                                    <div class="filter-group" style="display:flex; flex-direction:column; gap:3px; flex:1;">
                                        <label style="font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em;">Año</label>
                                        <select id="rn-fnac-year" class="filter-select"></select>
                                    </div>
                                    <button type="button" id="rn-fnac-today" class="btn-module btn-clear-hover" style="padding:5px 12px; font-size:11px; white-space:nowrap; height:fit-content;">Hoy</button>
                                </div>
                                <div class="calendar-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                                    <button type="button" class="cal-nav-btn" id="rn-fnac-prev" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </button>
                                    <div class="cal-title" id="rn-fnac-title" style="font-size:14px; font-weight:700; color:#0f172a;"></div>
                                    <button type="button" class="cal-nav-btn" id="rn-fnac-next" style="width:30px; height:30px; border-radius:6px; border:1px solid #e2e8f0; background:#ffffff; color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-size:12px;">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                </div>
                                <div class="cal-weekdays" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px;">
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">D</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">L</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">M</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">MI</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">J</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">V</span>
                                    <span style="text-align:center; font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; padding:3px 0;">S</span>
                                </div>
                                <div class="cal-days-grid" id="rn-fnac-days-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;"></div>
                            </div>
                        </div>

                        <!-- FILA 3: TIPO DOC MAMA | NUM DOC MAMA | NOMBRE MAMA -->
                        <div class="input-stacked col-span-2">
                            <label>Tipo Doc. Mamá</label>
                            <div class="global-search-box"
                                style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-id-card" style="color:#64748b; margin-right:10px;"></i>
                                 <select id="rn-tipo-doc-mama" class="global-search-input custom-select-source"
                                    style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="DNI">DNI</option>
                                    <option value="CEDULA_IDEN">CÉDULA DE IDENTIDAD</option>
                                    <option value="CARNET_EXT">CARNET DE EXTRANJERÍA</option>
                                </select>
                                <i class="fa-solid fa-chevron-down"
                                    style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Nº Documento Mamá</label>
                            <input type="text" id="rn-num-doc-mama" class="standard-input" required
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                maxlength="15">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Apellidos y Nombres Mamá</label>
                            <input type="text" id="rn-nombre-mama" class="standard-input" required
                                oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s]/g, '')">
                        </div>

                        <!-- FILA 4: ESTABLECIMIENTO | TIPO DOC PAPA | NUM DOC PAPA -->
                        <div class="input-stacked col-span-2">
                            <label>Establecimiento de Salud</label>
                            <input type="text" id="rn-establecimiento" class="standard-input" placeholder="Opcional">
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Tipo Doc. Papá</label>
                            <div class="global-search-box"
                                style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-id-card" style="color:#64748b; margin-right:10px;"></i>
                                 <select id="rn-tipo-doc-papa" class="global-search-input custom-select-source"
                                    style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="">Opcional</option>
                                    <option value="DNI">DNI</option>
                                    <option value="CEDULA_IDEN">CÉDULA DE IDENTIDAD</option>
                                    <option value="CARNET_EXT">CARNET DE EXTRANJERÍA</option>
                                </select>
                                <i class="fa-solid fa-chevron-down"
                                    style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Nº Documento Papá</label>
                            <input type="text" id="rn-num-doc-papa" class="standard-input" placeholder="Opcional"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                maxlength="15">
                        </div>

                        <!-- FILA 5: TIPO SEGURO PAPA | ESTADO TEMPORAL -->
                        <div class="input-stacked col-span-2">
                            <label>Tipo Seguro del Papá</label>
                            <div class="global-search-box"
                                style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-shield-halved" style="color:#64748b; margin-right:10px;"></i>
                                 <select id="rn-tipo-seguro-papa" class="global-search-input custom-select-source"
                                    style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="">Opcional</option>
                                    <option value="EPS">EPS</option>
                                    <option value="ESSALUD">ESSALUD</option>
                                    <option value="SALUDPOL">SALUDPOL</option>
                                    <option value="SANIDADES">SANIDADES</option>
                                    <option value="SANITAS">SANITAS</option>
                                    <option value="SCTR">SCTR</option>
                                    <option value="SIS">SIS</option>
                                </select>
                                <i class="fa-solid fa-chevron-down"
                                    style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <div class="input-stacked col-span-2">
                            <label>Estado Temporal</label>
                            <div class="global-search-box"
                                style="width:100%; display:flex; align-items:center; background:#ffffff; border-radius:8px; border:1px solid #e2e8f0; padding:0 15px; position:relative; height:42px;">
                                <i class="fa-solid fa-circle-info" style="color:#64748b; margin-right:10px;"></i>
                                 <select id="rn-estado-temporal" class="global-search-input custom-select-source"
                                    style="border:none; padding:0; outline:none; flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer; color:inherit; background:transparent; font-size:13px;">
                                    <option value="ACTIVO" selected>ACTIVO</option>
                                    <option value="CANCELADO">CANCELADO</option>
                                </select>
                                <i class="fa-solid fa-chevron-down"
                                    style="position:absolute; right:15px; color:#64748b; font-size:12px; pointer-events:none;"></i>
                            </div>
                        </div>

                        <!-- ACCIONES -->
                        <div class="form-actions"
                            style="grid-column: 1 / -1; display: flex; gap: 15px; margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                            <button type="button" class="btn-module" id="rn-btn-cancelar"
                                style="padding: 12px 25px;">Cancelar</button>
                            <button type="submit" class="btn-module primary" id="rn-btn-guardar"
                                style="padding: 12px 25px;">
                                <span id="rn-guardar-text">Guardar</span>
                                <i id="rn-guardar-spinner" class="fa-solid fa-circle-notch fa-spin"
                                    style="display:none; margin-left:8px;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/calendario-popover.js"></script>
    <script src="../../js/custom-select.js"></script>
    <script src="../../js/dynamic-table.js"></script>
    <script src="../../js/recien-nacidos.js"></script>
</body>

</html>
