<!DOCTYPE html><html lang="es"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Reportes - Hospital San José</title> <link rel="stylesheet" href="../../css/styles.css"> <link rel="stylesheet" href="../../css/calendario-popover.css"> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <link rel="stylesheet" href="../../css/reportes.css"> <link rel="preload" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" as="script" crossorigin="anonymous"> <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" as="script" crossorigin="anonymous"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" media="print" onload="this.media='all'"> <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous"></noscript></head><body> <div class="main-wrapper"> <main class="page-content" id="page-content"> <div class="reports-page"> <div class="rp-actions-bar"> <div class="rp-date-wrapper"> <div class="rp-date-trigger" id="rp-date-trigger"> <i class="fa-regular fa-calendar" style="color:#64748b;"></i> <span class="rp-date-display" id="rp-date-display">Seleccionar rango de fechas</span> <i class="fa-solid fa-chevron-down" style="color:#94a3b8;font-size:11px;"></i> </div> <div class="rp-date-popover" id="rp-date-popover"> <div class="cal-filters"> <div class="filter-group"> <label>Mes</label> <select id="rp-filter-month" class="filter-select"></select> </div> <div class="filter-group"> <label>Año</label> <select id="rp-filter-year" class="filter-select"></select> </div> <button id="rp-cal-today" class="btn-module btn-clear-hover" style="padding:5px 12px;font-size:11px;white-space:nowrap;height:fit-content;">Hoy</button> </div> <div class="cal-header"> <button class="cal-nav-btn" id="rp-cal-prev">‹</button> <div class="cal-title" id="rp-cal-title"></div> <button class="cal-nav-btn" id="rp-cal-next">›</button> </div> <div class="cal-weekdays"><span>D</span><span>L</span><span>M</span><span>MI</span><span>J</span><span>V</span><span>S</span></div> <div class="cal-days-grid" id="rp-cal-days-grid"></div> </div> </div> <button class="rp-hastahoy-btn" id="rp-hasta-hoy"><i class="fa-solid fa-calendar-day"></i> Hasta hoy</button> <div class="custom-select-wrapper filter-dropdown-wrapper" id="custom-filter-servicio" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" style="width:170px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;height:42px;display:flex;align-items:center;padding:0 12px;"> <div class="custom-select-trigger" style="text-transform:none;gap:8px;width:100%;"> <i class="fa-solid fa-building trigger-icon" style="color:#64748b;"></i> <span class="custom-select-text"></span> <i class="fa-solid fa-chevron-down chevron-icon" style="color:#94a3b8;font-size:12px;margin-left:auto;"></i> </div> <ul class="custom-select-options" role="listbox" id="custom-filter-servicio-list"></ul> </div> <select id="filter-servicio" data-servicio="upper" style="display:none"> <option value="">TODOS</option> </select> <button class="btn-clear" id="btn-clear-reportes"><i class="fa-solid fa-eraser"></i> Limpiar Filtro</button> <button class="btn-export excel" id="btn-export-excel" style="height:42px;font-size:13px;"><i class="fa-solid fa-file-excel"></i> Excel</button> <button class="btn-export print" id="btn-export-print" style="height:42px;font-size:13px;"><i class="fa-solid fa-print"></i> Imprimir / PDF</button> <button class="rp-generate-btn" id="btn-generate"><i class="fa-solid fa-rotate"></i> Generar Reporte</button> </div> <div class="loading-overlay" id="loading-reports"> <div class="spinner-reports"></div> <span>Cargando datos...</span> </div> <div class="rp-reports-layout"> <div class="chart-card" data-area="score"> <h3><i class="fa-solid fa-chart-pie"></i> Score General</h3> <div class="score-body"> <div class="score-number" id="score-number">0</div> <div class="score-label">Total Pacientes</div> <div class="score-period" id="score-period"></div> </div> </div> <div class="chart-card" data-area="condicion"> <h3><i class="fa-solid fa-bed"></i> Condición</h3> <div class="cond-stats" id="cond-stats"></div> </div> <div class="chart-card" data-area="seguro"> <h3><i class="fa-solid fa-shield"></i> Tipo Seguro</h3> <div class="seg-stats" id="seg-stats"></div> </div> <div class="trends-row" data-area="trends"> <div class="chart-card"> <h3><i class="fa-solid fa-right-to-bracket"></i> Admisiones</h3> <div class="chart-wrapper"><canvas id="chart-admisiones"></canvas></div> </div> <div class="chart-card"> <h3><i class="fa-solid fa-chart-bar"></i> Grupo Etario</h3> <div class="chart-wrapper"><canvas id="chart-edad"></canvas></div> </div> </div> <div class="chart-card" data-area="servicios"> <h3><i class="fa-solid fa-chart-column"></i> Distribución por Servicio</h3> <div class="chart-wrapper service-bar"><canvas id="chart-servicios"></canvas></div> </div> </div> </div> </main> </div> <script src="../../js/supabase-config.js"></script> <script src="../../js/layout.js"></script> <script src="../../js/servicios.js"></script> <script src="../../js/filter-dropdown.js"></script><script>document.addEventListener('DOMContentLoaded',function(){var e=document.getElementById('filter-servicio'),t=[];for(var n=0;n<e.options.length;n++)e.options[n].value&&t.push(e.options[n].text);window.createFilterDropdown({dropdownEl:document.getElementById('custom-filter-servicio'),listEl:document.getElementById('custom-filter-servicio-list'),hiddenSelectEl:e,defaultText:'TODOS',options:t})});</script> <script src="../../js/calendario-popover.js"></script> <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> <script
