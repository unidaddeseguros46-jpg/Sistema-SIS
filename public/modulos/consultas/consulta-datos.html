<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Datos - Hospital San José</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/registro-pacientes.css">
    <link rel="stylesheet" href="../../css/seguimiento-pacientes.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #header-search-box i.fa-magnifying-glass {
            color: #64748b;
            font-size: 14px;
            flex-shrink: 0;
        }

        .susalud-copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 12px;
            padding: 0 3px;
            transition: color 0.2s;
            line-height: 1;
        }

        .susalud-copy-btn[data-creds="usuario"]:hover { color: #3b82f6 !important; }
        .susalud-copy-btn[data-creds="clave"]:hover { color: #10b981 !important; }

        .susalud-creds-bar {
            display: none;
            gap: 6px;
            white-space: nowrap;
        }

        .external-links-row {
            display: flex;
            gap: 8px;
        }

        .external-links-label {
            width: 195px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .external-links-spacer {
            width: 195px;
            flex-shrink: 0;
            min-width: 195px;
        }

        .external-link-btn {
            width: 195px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #475569;
            background: #fff;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            gap: 8px;
            border-radius: 8px;
            padding: 10px 12px;
            height: 42px;
        }

        .external-link-btn i {
            color: #64748b;
        }

        .text-center {
            text-align: center;
        }

        #view-resultados {
            margin-top: 20px;
        }

        #blocking-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        #blocking-overlay .overlay-text {
            text-align: center;
        }

        #blocking-overlay .overlay-text p:first-child {
            margin: 0;
            font-weight: 700;
            color: #0f172a;
            font-size: 16px;
        }

        #blocking-overlay .overlay-text p:nth-child(2) {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 15px;
        }

        #btn-cancel-search {
            padding: 8px 18px;
            background: white;
            color: #ef4444;
            border: 1px solid #fee2e2;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }

        #modal-registro {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        #modal-registro .modal-card {
            width: calc(100% - 350px);
            min-width: 500px;
            height: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #iframe-registro {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    </noscript>
</head>
<body>
    <div class="main-wrapper">
        <main class="page-content" id="page-content">
            <div class="module-commands">
                <div class="commands-left table-toolbar">
                    <div class="filter-group">
                        <label class="filter-label">Buscador</label>
                        <div class="input-clear-wrap" id="header-search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="filter-dni" class="filter-input" placeholder="DNI (8 dígitos)" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="8">
                            <button class="search-clear-btn" id="cd-clear-btn" type="button" aria-label="Limpiar" style="display:none"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <div class="external-links-row">
                            <div class="external-links-label">
                                <label class="filter-label" style="margin-bottom:0;">Enlaces externos</label>
                                <span class="susalud-creds-bar">
                                    <button class="susalud-copy-btn" data-creds="usuario" title="Copiar usuario SUSALUD"><i class="fa-solid fa-user"></i></button>
                                    <button class="susalud-copy-btn" data-creds="clave" title="Copiar clave SUSALUD"><i class="fa-solid fa-lock"></i></button>
                                </span>
                            </div>
                            <div class="external-links-spacer"></div>
                        </div>
                        <div class="external-links-row">
                            <a href="https://app1.susalud.gob.pe/registro/Account/LogOn" target="_blank" class="btn-clear-hover external-link-btn">
                                <i class="fa-solid fa-external-link-alt"></i> Ir a SUSALUD
                            </a>
                            <a href="https://cel.sis.gob.pe/SisConsultaEnLinea" target="_blank" class="btn-clear-hover external-link-btn">
                                <i class="fa-solid fa-external-link-alt"></i> Ir a SIS
                            </a>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-module primary" id="btn-consultar"><i class="fa-solid fa-magnifying-glass"></i> Consultar Datos</button>
                        <button class="btn-module btn-clear-hover" id="btn-clear">Limpiar</button>
                    </div>
                </div>
            </div>
            <div id="view-resultados" style="display: none;">
                <div class="data-table-container">
                    <table class="data-table" id="table-pacientes">
                        <thead>
                            <tr>
                                <th>DNI</th>
                                <th>Paciente</th>
                                <th>F. Nacimiento</th>
                                <th>CUI / DV</th>
                                <th>Afiliado a</th>
                                <th>Estado</th>
                                <th>Fecha/Hora</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-pacientes"></tbody>
                    </table>
                </div>
            </div>
            <div id="blocking-overlay">
                <div class="spinner-rpa"></div>
                <div class="overlay-text">
                    <p id="overlay-msg">Consultando fuentes...</p>
                    <p>Esto puede tardar unos segundos</p>
                    <button id="btn-cancel-search"><i class="fa-solid fa-xmark"></i> Cancelar Consulta</button>
                </div>
            </div>
            <div id="modal-registro">
                <div class="modal-card">
                    <iframe id="iframe-registro" src=""></iframe>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="consulta-datos.js"></script>
</body>
</html>
